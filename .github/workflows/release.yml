name: Release

run-name: ${{ github.actor }} - ${{ inputs.release_tag || github.ref_name }} - Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing non-draft GitHub Release tag to publish to PyPI
        required: true
        type: string

concurrency:
  group: dmw-experiments-release
  cancel-in-progress: false

jobs:
  checks:
    name: Full CI
    if: github.event_name == 'push'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    name: Build release artifacts
    if: github.event_name == 'push'
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_pypi: ${{ steps.release_policy.outputs.release_pypi }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: auto

      - name: Install just
        uses: extractions/setup-just@v4
        with:
          just-version: "1.56.0"

      - name: Validate release policy
        id: release_policy
        shell: bash
        run: |
          release_pypi="$(just --evaluate RELEASE_PYPI)"
          if [[ "$release_pypi" != "true" && "$release_pypi" != "false" ]]; then
            echo "RELEASE_PYPI must be \"true\" or \"false\", found '${release_pypi}'." >&2
            exit 1
          fi
          echo "release_pypi=${release_pypi}" >> "$GITHUB_OUTPUT"

      - name: Build and validate release bundle
        run: just _release-artifact-check release/release-notes.md

      - name: Preserve release bundle
        uses: actions/upload-artifact@v7
        with:
          name: release-bundle-${{ github.ref_name }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            release/release-notes.md
          if-no-files-found: error
          retention-days: 14

  github-release:
    name: Create GitHub Release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Restore release bundle
        uses: actions/download-artifact@v8
        with:
          name: release-bundle-${{ github.ref_name }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            dist/*.whl \
            dist/*.tar.gz \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --latest \
            --title "dmw_experiments ${release_version}" \
            --notes-file release/release-notes.md

  pypi-publish:
    name: Publish to PyPI
    if: >-
      github.event_name == 'push' &&
      needs.build.outputs.release_pypi == 'true'
    needs:
      - build
      - github-release
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Restore release bundle
        uses: actions/download-artifact@v8
        with:
          name: release-bundle-${{ github.ref_name }}

      - name: Publish to PyPI with trusted publishing
        shell: bash
        run: |
          uv publish \
            --trusted-publishing always \
            --check-url https://pypi.org/simple/dmw-experiments/ \
            dist/*

  publish-existing-release:
    name: Publish existing GitHub Release to PyPI
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"

      - name: Download and validate GitHub Release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release tag '${RELEASE_TAG}'; expected vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          if ! is_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"; then
            echo "GitHub Release ${RELEASE_TAG} does not exist." >&2
            exit 1
          fi
          if [[ "$is_draft" == "true" ]]; then
            echo "GitHub Release ${RELEASE_TAG} is still a draft." >&2
            exit 1
          fi

          mkdir dist
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir dist \
            --pattern '*.whl' \
            --pattern '*.tar.gz'

          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          version="${RELEASE_TAG#v}"
          if [[ "${#wheels[@]}" -ne 1 || "${#sdists[@]}" -ne 1 ]]; then
            echo "Expected exactly one wheel and one source archive on ${RELEASE_TAG}." >&2
            exit 1
          fi
          if [[ "$(basename "${wheels[0]}")" != dmw_experiments-${version}-*.whl ]]; then
            echo "The wheel filename does not match ${RELEASE_TAG}: ${wheels[0]}." >&2
            exit 1
          fi
          if [[ "$(basename "${sdists[0]}")" != "dmw_experiments-${version}.tar.gz" ]]; then
            echo "The source archive filename does not match ${RELEASE_TAG}: ${sdists[0]}." >&2
            exit 1
          fi
          uv run --with twine --no-project -- twine check "${wheels[0]}" "${sdists[0]}"

      - name: Publish existing artifacts to PyPI
        run: |
          uv publish \
            --trusted-publishing always \
            --check-url https://pypi.org/simple/dmw-experiments/ \
            dist/*
