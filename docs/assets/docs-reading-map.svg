  <text class="small" x="300" y="302">Maintainer loop</text>
  <rect class="box" x="500" y="248" width="180" height="70" />
  <text class="label" x="538" y="278">References</text>
  <text class="small" x="534" y="302">Exact names</text>
  <rect class="box" x="730" y="248" width="180" height="70" />
