<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="360" viewBox="0 0 1180 360" role="img" aria-labelledby="title desc">
  <title id="title">dmw_experiments documentation reading map</title>
  <desc id="desc">The root README points to the docs index, which points to how-to guides, development notes, references, explanations, and study documentation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#666666" />
    </marker>
    <style>
      text { font-family: sans-serif; fill: #000000; }
      .title { font-size: 20px; font-weight: 700; }
      .label { font-size: 16px; font-weight: 700; }
      .small { font-size: 13px; }
      .box { fill: #f4f4f4dd; stroke: #666666; stroke-width: 2; rx: 8; }
      .line { stroke: #666666; stroke-width: 2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect x="28" y="18" width="420" height="40" fill="#f4f4f4dd" stroke="#666666" stroke-width="1.5" rx="8" />
  <text class="title" x="40" y="44">dmw_experiments Documentation Map</text>
  <rect class="box" x="60" y="92" width="180" height="88" />
  <text class="label" x="88" y="128">Root README</text>
  <text class="small" x="86" y="154">Short entry point</text>
  <rect class="box" x="500" y="92" width="180" height="88" />
  <text class="label" x="530" y="128">docs/README</text>
  <text class="small" x="528" y="154">Navigation rules</text>
  <line class="line" x1="240" y1="136" x2="490" y2="136" />
