  <text class="small" x="988" y="302">Scientific design</text>
  <line class="line" x1="550" y1="180" x2="150" y2="240" />
  <line class="line" x1="570" y1="180" x2="375" y2="240" />
  <line class="line" x1="590" y1="180" x2="590" y2="240" />
  <line class="line" x1="610" y1="180" x2="805" y2="240" />
